name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test PostForge.slnx --configuration Release --no-restore --verbosity normal --filter "FullyQualifiedName!~IntegrationTests"
      - run: dotnet publish src/PostForge.Api --configuration Release --no-restore --output ./publish/api
      - run: dotnet publish src/PostForge.Worker --configuration Release --no-restore --output ./publish/worker
      - uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: ./publish/api
      - uses: actions/upload-artifact@v4
        with:
          name: worker-artifact
          path: ./publish/worker

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet test tests/PostForge.IntegrationTests --configuration Release --no-restore --verbosity normal --logger trx --results-directory ./test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./test-results
